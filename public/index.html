<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Render Web Proxy</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
}

#topbar {
  height: 48px;
  background: #111;
  display: flex;
  align-items: center;
  padding: 0 8px;
}

#url {
  flex: 1;
  height: 32px;
  font-size: 16px;
}

#go {
  margin-left: 8px;
  height: 32px;
}

iframe {
  width: 100%;
  height: calc(100% - 48px);
  border: none;
  display: block;
}
</style>
</head>

<body>

<div id="topbar">
  <input id="url" value="https://example.com">
  <button id="go">GO</button>
</div>

<iframe id="view"></iframe>

<script>
const iframe = document.getElementById("view");
document.getElementById("go").onclick = () => {
  iframe.src = "/service/" + document.getElementById("url").value;
};
iframe.src = "/service/https://example.com";
</script>

</body>
</html>
