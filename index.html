<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>仙人Proxy</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --main:#6366f1;
  --bg:#f4f7ff;
  --card:#ffffff;
}
body{
  margin:0;
  background:linear-gradient(135deg,#eef2ff,#f8fafc);
  font-family:system-ui,sans-serif;
}
header{
  padding:16px;
  font-size:20px;
  font-weight:800;
  background:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
}
.wrap{
  max-width:1000px;
  margin:20px auto;
  padding:16px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  box-shadow:0 10px 40px rgba(0,0,0,.1);
}
.row{display:flex;gap:10px}
input{
  flex:1;
  padding:14px;
  font-size:16px;
  border-radius:12px;
  border:1px solid #c7d2fe;
}
button{
  padding:14px 20px;
  font-size:16px;
  border-radius:12px;
  border:none;
  background:var(--main);
  color:#fff;
  cursor:pointer;
}
iframe{
  width:100%;
  height:72vh;
  border:none;
  border-radius:16px;
  margin-top:14px;
}

/* アラート */
.alert{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%) translateY(-20px);
  background:#ef4444;
  color:#fff;
  padding:14px 20px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  opacity:0;
  pointer-events:none;
  transition:.4s ease;
}
.alert.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>
<header>仙人Proxy</header>

<div class="wrap">
  <div class="card">
    <div class="row">
      <input id="url" placeholder="https://example.com">
      <button onclick="openProxy()">開く</button>
    </div>
    <iframe id="view"></iframe>
  </div>
</div>

<div class="alert" id="alert">サイトを開けませんでした</div>

<script>
const iframe = document.getElementById("view");
const alertBox = document.getElementById("alert");
let timer;

function showAlert(text){
  alertBox.textContent = text;
  alertBox.classList.add("show");
  setTimeout(()=>alertBox.classList.remove("show"),3000);
}

function openProxy(){
  const url=document.getElementById("url").value.trim();
  if(!url) return showAlert("URLを入力してね");

  iframe.src="/proxy?url="+encodeURIComponent(url);

  clearTimeout(timer);
  timer=setTimeout(()=>{
    showAlert("読み込みに失敗しました（制限の可能性）");
  },8000);
}

iframe.onload=()=>clearTimeout(timer);
iframe.onerror=()=>showAlert("このサイトは表示できません");
</script>
</body>
</html>
