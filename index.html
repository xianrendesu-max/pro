<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>仙人Proxy</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --main:#6366f1;
  --bg:#f4f7ff;
  --card:#ffffff;
  --text:#1e293b;
}
body{
  margin:0;
  background:linear-gradient(135deg,#eef2ff,#f8fafc);
  font-family:system-ui,sans-serif;
  color:var(--text);
}
header{
  padding:16px 22px;
  font-size:20px;
  font-weight:800;
  background:var(--card);
  box-shadow:0 6px 20px rgba(0,0,0,.08);
}
.wrap{
  max-width:1000px;
  margin:20px auto;
  padding:16px;
}
.card{
  background:var(--card);
  border-radius:18px;
  padding:16px;
  box-shadow:0 10px 40px rgba(0,0,0,.1);
}
.row{
  display:flex;
  gap:10px;
}
input{
  flex:1;
  padding:14px;
  font-size:16px;
  border-radius:12px;
  border:1px solid #c7d2fe;
}
button{
  padding:14px 20px;
  font-size:16px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  background:var(--main);
  color:#fff;
}
button.sub{
  background:#e0e7ff;
  color:#3730a3;
}
.history{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}
.loading{
  margin-top:10px;
  font-weight:700;
  color:var(--main);
  display:none;
}
iframe{
  width:100%;
  height:72vh;
  border:none;
  border-radius:16px;
  margin-top:14px;
  background:#fff;
}
</style>
</head>

<body>
<header>🧙‍♂️ 仙人Proxy</header>

<div class="wrap">
  <div class="card">
    <div class="row">
      <input id="url" placeholder="https://example.com">
      <button onclick="openProxy()">開く</button>
    </div>

    <div class="loading" id="loading">読み込み中…</div>
    <div class="history" id="history"></div>
    <iframe id="view"></iframe>
  </div>
</div>

<script>
const iframe = document.getElementById("view");
const loading = document.getElementById("loading");
const historyBox = document.getElementById("history");

function openProxy(u){
  const url = u || document.getElementById("url").value.trim();
  if(!url) return alert("URLを入力してね");

  save(url);
  loading.style.display="block";
  iframe.src="/proxy?url="+encodeURIComponent(url);
  iframe.onload=()=>loading.style.display="none";
}

function save(url){
  let list=JSON.parse(localStorage.getItem("sennin_history")||"[]");
  list=[url,...list.filter(x=>x!==url)].slice(0,6);
  localStorage.setItem("sennin_history",JSON.stringify(list));
  draw();
}

function draw(){
  historyBox.innerHTML="";
  const list=JSON.parse(localStorage.getItem("sennin_history")||"[]");
  list.forEach(u=>{
    const b=document.createElement("button");
    b.className="sub";
    b.textContent=u;
    b.onclick=()=>openProxy(u);
    historyBox.appendChild(b);
  });
}
draw();
</script>
</body>
</html>
